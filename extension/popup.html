<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>KPN TV+ RTL AdSkip</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f141a;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .badge {
      background: #00b33c;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .title {
      font-weight: 600;
      font-size: 15px;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .label {
      color: #8b949e;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #30363d;
      transition: .2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #00b33c;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }
    .shortcuts {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 10px;
      margin-top: 14px;
      font-size: 12px;
    }
    .shortcuts strong {
      display: block;
      color: #58a6ff;
      margin-bottom: 6px;
    }
    .key-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    kbd {
      background: rgba(255,255,255,0.15);
      padding: 2px 5px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">ACTIEF</span>
    <span class="title">KPN TV+ AdSkip</span>
  </div>

  <div class="setting-row">
    <span class="label">Pre-roll Auto-Skip</span>
    <label class="switch">
      <input type="checkbox" id="autoSkipPreRoll" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="shortcuts">
    <strong>Sneltoetsen</strong>
    <div class="key-row"><span>Skip Reclameblok:</span> <kbd>S</kbd> of <kbd>A</kbd></div>
    <div class="key-row"><span>Vooruit (+30s):</span> <kbd>→</kbd></div>
    <div class="key-row"><span>Vooruit (+2m):</span> <kbd>Shift + →</kbd></div>
    <div class="key-row"><span>Terug (-15s):</span> <kbd>←</kbd></div>
    <div class="key-row"><span>Herstellen (Undo):</span> <kbd>Z</kbd></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
